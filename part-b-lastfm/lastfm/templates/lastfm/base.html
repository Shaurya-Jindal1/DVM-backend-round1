{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Last.fm Explorer{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'lastfm/style.css' %}">
</head>
<body>
    <div class="navbar">
        <a href="{% url 'lastfm:home' %}" class="logo">Last.fm Explorer</a>
        <a href="{% url 'lastfm:charts' %}">Charts</a>
        <a href="{% url 'lastfm:search' %}">Search</a>
    </div>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
